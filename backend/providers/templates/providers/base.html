<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRL Services - Provider Verification</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>body{font-family:Arial,sans-serif;background:#f6f8fc;margin:0;color:#222}.nav{background:#0d6efd;color:#fff;padding:16px 7%;display:flex;justify-content:space-between;align-items:center}.nav a{color:#fff;text-decoration:none;margin-left:18px}.container{max-width:1050px;margin:40px auto;padding:0 20px}.card{background:#fff;padding:28px;border-radius:14px;box-shadow:0 5px 20px #0001;margin-bottom:20px}h1,h2{color:#0d6efd}.btn{display:inline-block;background:#0d6efd;color:white;padding:11px 18px;border-radius:7px;text-decoration:none;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e7f7ed;color:#16833c;font-weight:bold}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3df;border-radius:7px}input[type=file]{background:#fff}.errorlist{color:#c00}.photo{width:100%;height:190px;object-fit:cover;border-radius:10px}@media(max-width:800px){.grid,.form-row{grid-template-columns:1fr}.nav{display:block}.nav a{display:inline-block;margin:8px 10px 0 0}}</style></head><body><div class="nav"><strong>HRL Services</strong><div><a href="/provider/register/">Become a Provider</a><a href="/provider/list/">Verified Providers</a><a href="/admin/">Admin</a></div></div>{% block content %}{% endblock %}</body></html>
